name: Yoda M3U8 Token Extractor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  extract-tokens:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests selenium webdriver-manager
    
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    
    - name: Create output directory
      run: mkdir -p links/yoda
    
    - name: Run the script
      run: python yoda_m3u8_extractor.py
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: yoda-m3u8-links
        path: links/yoda/*.m3u8
        retention-days: 7
    
    - name: Upload metadata
      uses: actions/upload-artifact@v4
      with:
        name: yoda-metadata
        path: links/yoda/*.json
        retention-days: 7
    
    - name: Commit and push if changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add links/yoda/*.m3u8 links/yoda/*.json 2>/dev/null || true
        git diff --staged --quiet || git commit -m "Update M3U8 links [skip ci]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
